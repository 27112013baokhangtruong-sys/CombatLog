name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build bằng Maven
        run: mvn -B clean package

      - name: Tải file jar lên
        uses: actions/upload-artifact@v4
        with:
          name: CombatLog
          path: target/CombatLog-*.jar
